<!DOCTYPE html>
<html lang="en" data-page="commands">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commands — theeshinigami</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header" role="banner"></header>

  <main class="container" id="main">
    <h1>Command reference</h1>
    <p style="color:var(--ink-2);margin-bottom:1.5rem;font-size:0.9rem;">Search across 200 commands, tools, and techniques. Filter by category or OS.</p>

    <label for="cmd-search" class="sr-only">Search commands</label>
    <input type="search" id="cmd-search" class="search-input" placeholder="Search commands, tools, techniques&hellip;" autocomplete="off">

    <div style="display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;margin:1rem 0;">
      <div class="filter-bar" id="cmd-cat-bar"></div>
      <div class="filter-bar" id="cmd-os-bar"></div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
      <span class="results-count" id="cmd-count"></span>
      <button type="button" class="btn btn--small" id="cmd-clear" style="display:none;">Clear filters</button>
    </div>

    <ul class="cmd-list" id="cmd-list" aria-label="Command results"></ul>

    <div class="empty-state" id="cmd-no-match" style="display:none;">
      No commands match your filters. Try a different search or clear the filters.
    </div>
  </main>

  <footer class="site-footer" id="site-footer" role="contentinfo"></footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/commands.js"></script>
</body>
</html>
